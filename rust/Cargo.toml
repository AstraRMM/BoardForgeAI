[workspace]
resolver = "2"
members = [
  "crates/boardforge-core",
  "crates/boardforge-geometry",
  "crates/boardforge-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Proprietary"
repository = "https://github.com/boardforge/boardforge-ai"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4", "js"] }
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
